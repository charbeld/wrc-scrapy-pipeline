# Local infrastructure for the pipeline: a NoSQL database and an object store.
# Both are containerised so a reviewer reproduces the exact same versions with
# one command. Values come from .env (Compose reads it automatically).
services:
  mongo:
    image: mongo:7
    container_name: wrc-mongo
    restart: unless-stopped
    ports:
      - "${WRC_MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${WRC_MONGO_ROOT_USER:-wrc}
      MONGO_INITDB_ROOT_PASSWORD: ${WRC_MONGO_ROOT_PASSWORD:-wrc_password}
    volumes:
      # Named volume: metadata survives `docker compose down` (but not `down -v`).
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: wrc-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${WRC_S3_PORT:-9000}:9000"      # S3 API
      - "${WRC_S3_CONSOLE_PORT:-9001}:9001"  # Web console
    environment:
      MINIO_ROOT_USER: ${WRC_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${WRC_S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot container that creates the two buckets once MinIO reports healthy.
  # The application also calls ensure_buckets() at startup, so this is a
  # convenience, not a hard dependency.
  minio-init:
    image: minio/mc:latest
    container_name: wrc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${WRC_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${WRC_S3_SECRET_KEY:-minioadmin}
      LANDING_BUCKET: ${WRC_S3_LANDING_BUCKET:-landing}
      TRANSFORMED_BUCKET: ${WRC_S3_TRANSFORMED_BUCKET:-transformed}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${LANDING_BUCKET} &&
      mc mb --ignore-existing local/$${TRANSFORMED_BUCKET} &&
      echo 'buckets ready'
      "

volumes:
  mongo_data:
  minio_data:
