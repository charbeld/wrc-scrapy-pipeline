[project]
name = "wrc-scrapy-pipeline"
version = "1.0.0"
description = "Scrapy pipeline that ingests Irish employment-law decisions from workplacerelations.ie into MongoDB + object storage, orchestrated with Dagster."
readme = "README.md"
# Pinned to 3.12: Scrapy/Twisted/Dagster are validated there, and compiled wheels
# (lxml, pymongo) are reliably available. The machine default 3.14 is not supported yet.
requires-python = ">=3.12,<3.13"
dependencies = [
    "scrapy>=2.13,<2.14",
    "pymongo>=4.9,<5",
    "boto3>=1.35,<2",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.2,<6",
    "structlog>=24.4,<26",
    "pydantic-settings>=2.5,<3",
    "python-dateutil>=2.9,<3",
    "dagster>=1.9,<2",
    "dagster-webserver>=1.9,<2",
]

[project.scripts]
wrc = "wrc_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wrc_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = [
    "B008",   # function call in default argument: used deliberately for Settings injection
    "RUF012", # mutable class attrs: Scrapy spiders use plain dict/list class attributes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: hits the live website and the Docker services"]
filterwarnings = ["ignore::DeprecationWarning"]
